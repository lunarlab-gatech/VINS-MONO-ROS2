session_name: vins_mono

environment:
  ROS_DIR: '/opt/ros/foxy'
  DATA_DIR: '/home/dbutterfield3/data/Hercules_datasets/V1.5/extract/bags_for_vins_mono'
  ROS_WS: '/home/dbutterfield3/vins_mono_ws'

options:
  default-command: /bin/bash

windows:
- window_name: main
  layout: tiled
  focus: true
  shell_command_before:
  - source $ROS_DIR/setup.bash
  - source $ROS_WS/install/setup.bash
  panes:
  - shell_command:
    - 
  - shell_command:
    - sleep 2
    - ros2 launch feature_tracker vins_feature_tracker.launch.py config_path:=config/hercules/Husky2.yaml
  - shell_command:
    - export RCL_LOG_LEVEL=DEBUG
    - sleep 2
    - ros2 launch vins_estimator euroc.launch.py config_path:=config/hercules/Husky2.yaml
  - shell_command:
    - sleep 4
    - ros2 bag play $DATA_DIR/Husky2 --topics /imu /cam0 /odom_gt /odom_gt/path

- window_name: kill
  layout: tiled
  panes:
  - tmux kill-session -t vins_mono_